name: PoC release

# Proposes a desired-state document for the operated-apps PoC (MRA-35, yo61/operated-apps-poc).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to propose for
        type: choice
        options: [staging, production]
        required: true
      digest:
        description: Production only, and required there - the artefact digest applied to staging
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: poc-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARTEFACT_REPOSITORY: ghcr.io/yo61/my-rf-app
  CONTROL_PLANE_URL: https://mra-poc-control-plane.clifton-cunningham.workers.dev

jobs:
  check:
    name: Check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ref and inputs
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -o errexit -o nounset -o pipefail
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Run from main; the control plane refuses any other ref ($GITHUB_REF)"
            exit 1
          fi
          if [[ $ENVIRONMENT == production && -z $DIGEST ]]; then
            echo "::error::Production needs the digest of an artefact already applied to staging"
            exit 1
          fi
          if [[ $ENVIRONMENT == staging && -n $DIGEST ]]; then
            echo "::error::Staging always builds; a digest is accepted for production only"
            exit 1
          fi
          if [[ -n $DIGEST && ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256: followed by 64 lowercase hex characters"
            exit 1
          fi

  build:
    name: Build
    needs: check
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: deploy/poc/build-artefact.sh "$RUNNER_TEMP/artefact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefact
          path: ${{ runner.temp }}/artefact
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish artefact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artefact
          path: artefact
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Push
        id: push
        shell: bash
        working-directory: artefact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          digest=$(oras push "$ARTEFACT_REPOSITORY:$GITHUB_SHA" \
            --artifact-type application/vnd.yo61.operated-app.v1 \
            dist/deploy:application/vnd.yo61.operated-app.worker.v1.tar+gzip \
            dist/ui:application/vnd.yo61.operated-app.assets.v1.tar+gzip \
            migrations:application/vnd.yo61.operated-app.migrations.v1.tar+gzip \
            worker-config.json:application/vnd.yo61.operated-app.worker-config.v1+json \
            --format json | jq --raw-output .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::oras push gave no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $ARTEFACT_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"

  propose:
    name: Sign and propose
    needs: [check, publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Sigstore certificate, and the control plane's bearer token
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Predicate
        id: predicate
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.digest || needs.publish.outputs.digest }}
        run: |
          set -o errexit -o nounset -o pipefail
          deploy/poc/predicate.sh "$ENVIRONMENT" "$DIGEST" > "$RUNNER_TEMP/predicate.json"
          jq . "$RUNNER_TEMP/predicate.json"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/predicate.json" >> "$GITHUB_OUTPUT"
      - name: Sign
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ARTEFACT_REPOSITORY }}
          subject-digest: ${{ steps.predicate.outputs.digest }}
          predicate-type: https://github.com/yo61/operated-apps-poc/desired-state/v1
          predicate-path: ${{ steps.predicate.outputs.path }}
      - name: Propose
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -o errexit -o nounset -o pipefail
          token=$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mra-poc-control-plane" | jq --raw-output .value)
          echo "::add-mask::$token"
          jq --compact-output --slurp last "$BUNDLE_PATH" > "$RUNNER_TEMP/bundle.json"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/response.json" \
            --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/vnd.dev.sigstore.bundle.v0.3+json' \
            --data-binary "@$RUNNER_TEMP/bundle.json" \
            "$CONTROL_PLANE_URL/v1/apps/my-app/environments/$ENVIRONMENT/documents")
          jq . "$RUNNER_TEMP/response.json"
          if [[ $status != 201 ]]; then
            echo "::error::Control plane answered $status"
            exit 1
          fi
          {
            echo "Proposed my-app/$ENVIRONMENT:"
            echo '```json'
            jq . "$RUNNER_TEMP/response.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
