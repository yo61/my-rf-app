name: Release

# Registers a v<semver> tag as a release with the operated-apps control plane (MRA-39).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTEFACT_REPOSITORY: ghcr.io/yo61/my-rf-app
  CONTROL_PLANE_URL: https://mra-poc-control-plane.clifton-cunningham.workers.dev

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME tags $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Tag is v<semver>
        id: tag
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! $GITHUB_REF_NAME =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<semver> without build metadata"
            echo "::error::(an OCI tag cannot hold the '+')"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          root_version=$(jq --raw-output .version package.json)
          if [[ $version != "$root_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from the root version ($root_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: deploy/poc/build-artefact.sh "$RUNNER_TEMP/artefact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefact
          path: ${{ runner.temp }}/artefact
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish artefact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artefact
          path: artefact
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Push
        id: push
        shell: bash
        working-directory: artefact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          digest=$(oras push "$ARTEFACT_REPOSITORY:$GITHUB_REF_NAME" \
            --artifact-type application/vnd.yo61.operated-app.v1 \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            dist/deploy:application/vnd.yo61.operated-app.worker.v1.tar+gzip \
            dist/ui:application/vnd.yo61.operated-app.assets.v1.tar+gzip \
            migrations:application/vnd.yo61.operated-app.migrations.v1.tar+gzip \
            worker-config.json:application/vnd.yo61.operated-app.worker-config.v1+json \
            --format json | jq --raw-output .digest)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::oras push gave no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $ARTEFACT_REPOSITORY:$GITHUB_REF_NAME ($digest)" >> "$GITHUB_STEP_SUMMARY"

  register:
    name: Attest and register
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore certificate, and the control plane's bearer token
      attestations: write
    steps:
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ARTEFACT_REPOSITORY }}
          subject-digest: ${{ needs.publish.outputs.digest }}
      - name: Register
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -o errexit -o nounset -o pipefail
          token=$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mra-poc-control-plane" | jq --raw-output .value)
          echo "::add-mask::$token"
          jq --slurp last "$BUNDLE_PATH" > "$RUNNER_TEMP/provenance.json"
          jq --null-input --compact-output \
            --arg version "$VERSION" --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" \
            --slurpfile provenance "$RUNNER_TEMP/provenance.json" \
            '{ version: $version, digest: $digest, commit: $commit, provenance: $provenance[0] }' \
            > "$RUNNER_TEMP/release.json"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/response.json" \
            --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/release.json" \
            "$CONTROL_PLANE_URL/v1/apps/my-app/releases")
          jq . "$RUNNER_TEMP/response.json"
          if [[ $status != 201 && $status != 200 ]]; then
            echo "::error::Control plane answered $status"
            exit 1
          fi
          {
            echo "Registered my-app $VERSION:"
            echo '```json'
            jq . "$RUNNER_TEMP/response.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
